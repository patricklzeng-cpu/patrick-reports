    if(hit)continue;
    placed.push(box);
    ctx.fillStyle=dim?'rgba(255,255,255,.14)':(zoomK>0.5?'rgba(244,241,235,.92)':'rgba(244,241,235,.55)');
    ctx.fillText(c.zh,x,y-r-10);
    ctx.font=`9px SFMono-Regular,Consolas,monospace`;
    ctx.fillStyle=dim?'rgba(255,255,255,.08)':'rgba(141,141,141,.75)';
    ctx.fillText(c.en.toUpperCase()+' · '+c.count,x,y-r+4);
  }
  // hub marker (site core = homepage at center of daily-reports? draw at world center)
  const[hx,hy]=w2s((B[0]+B[2])/2,(B[1]+B[3])/2);
  // nodes
  for(const n of nodes){
    const[x,y]=w2s(n.x,n.y);const r=Math.max(1.1,n.rad*Math.sqrt(cam.s)*0.55);
    if(x<-30||x>W+30||y<-30||y>H+30)continue;
    const dimC=activeCluster&&n.cluster!==activeCluster,dimQ=query&&!matches.has(n);
    let alpha=dimC||dimQ?0.07:0.9;
    if(n===hover)alpha=1;
    ctx.fillStyle=n.c.color;ctx.globalAlpha=alpha;
    ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
    if(n===hover){ctx.globalAlpha=1;ctx.strokeStyle='#fff';ctx.lineWidth=1.4;ctx.beginPath();ctx.arc(x,y,r+3.5,0,7);ctx.stroke()}
    else if(query&&matches.has(n)){ctx.globalAlpha=1;ctx.strokeStyle=n.c.color;ctx.lineWidth=1.1;ctx.beginPath();ctx.arc(x,y,r+2.6,0,7);ctx.stroke()}
    ctx.globalAlpha=1;
  }
  // hub core pulse
  const pr=5+2.2*Math.sin(now*2.2);
  ctx.fillStyle='#ff5b22';ctx.shadowColor='#ff5b22';ctx.shadowBlur=22;
  ctx.beginPath();ctx.arc(hx,hy,pr,0,7);ctx.fill();ctx.shadowBlur=0;
  ctx.font='10px SFMono-Regular,Consolas,monospace';ctx.fillStyle='rgba(255,179,143,.9)';
  ctx.fillText('2017zyl.xyz CORE',hx,hy+22);
  requestAnimationFrame(draw);
}
draw();animateCamTo(camT,1600);
// interaction
let drag=null,moved=0;
cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y};moved=0;cv.classList.add('dragging');cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{
  if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;moved=Math.max(moved,Math.hypot(dx,dy));
    cam.x=drag.cx-dx/cam.s;cam.y=drag.cy-dy/cam.s;return}
  const[wx,wy]=s2w(e.clientX,e.clientY);
  let best=null,bd=1e9;
  for(const n of nodes){const d=(n.x-wx)**2+(n.y-wy)**2;if(d<bd){bd=d;best=n}}
  const thresh=Math.max(36,(14/cam.s)**2);
  hover=bd<thresh?best:null;
  cv.classList.toggle('hovering',!!hover);
  const tip=document.getElementById('tip');
  if(hover){tip.style.display='block';
    tip.innerHTML=`<b>${esc(hover.title)}</b><span class="c" style="color:${hover.c.color}">${hover.c.zh} · ${hover.c.en.toUpperCase()}</span><span>${hover.path}<br>${(hover.size/1024).toFixed(1)} KB · ${hover.mtime}</span>`;
    const tw=tip.offsetWidth;tip.style.left=Math.min(W-tw-14,e.clientX+16)+'px';tip.style.top=Math.min(H-110,e.clientY+14)+'px';
  }else tip.style.display='none';
});
cv.addEventListener('pointerup',e=>{cv.classList.remove('dragging');
  if(drag&&moved<6&&hover)open('https://2017zyl.xyz/'+hover.path,'_blank');
  drag=null});
cv.addEventListener('wheel',e=>{e.preventDefault();
  const k=Math.exp(-e.deltaY*0.0016);
  const[wx,wy]=s2w(e.clientX,e.clientY);
  cam.s=Math.min(fitScale()*40,Math.max(fitScale()*0.35,cam.s*k));
  const[nx,ny]=s2w(e.clientX,e.clientY);
  cam.x+=wx-nx;cam.y+=wy-ny},{passive:false});
cv.addEventListener('dblclick',()=>animateCamTo({x:(B[0]+B[2])/2,y:(B[1]+B[3])/2,s:fitScale()}));
document.getElementById('zfit').onclick=()=>animateCamTo({x:(B[0]+B[2])/2,y:(B[1]+B[3])/2,s:fitScale()});
document.getElementById('zin').onclick=()=>animateCamTo({x:cam.x,y:cam.y,s:cam.s*1.6},350);
document.getElementById('zout').onclick=()=>animateCamTo({x:cam.x,y:cam.y,s:cam.s/1.6},350);
// legend
const rows=document.getElementById('legendRows');
document.getElementById('legendCount').textContent=clusters.length;
for(const c of clusters){
  const el=document.createElement('div');el.className='row';el.dataset.k=c.key;
  el.innerHTML=`<span class="dot" style="background:${c.color};color:${c.color}"></span><span class="nm">${c.zh}<small>${c.en.toUpperCase()}</small></span><span class="ct">${c.count}</span>`;
  el.onclick=()=>{
    if(activeCluster===c.key){activeCluster=null;document.querySelectorAll('#legend .row').forEach(r=>r.classList.remove('dim'))}
    else{activeCluster=c.key;document.querySelectorAll('#legend .row').forEach(r=>r.classList.toggle('dim',r.dataset.k!==c.key));
      animateCamTo({x:c.cx,y:c.cy,s:Math.min(fitScale()*40,Math.min(W,H)/(c.cr*2.6))},900)}
  };
  rows.appendChild(el);
}
const legend=document.getElementById('legend'),tab=document.getElementById('legendTab');
tab.onclick=()=>legend.classList.toggle('collapsed');
// search
const si=document.getElementById('search'),rs=document.getElementById('results');
si.addEventListener('input',()=>{
  query=si.value.trim().toLowerCase();matches=new Set();rs.innerHTML='';
  if(!query){rs.classList.remove('show');return}
  const hits=nodes.filter(n=>n.title.toLowerCase().includes(query)||n.path.toLowerCase().includes(query));
  hits.forEach(n=>matches.add(n));
  rs.classList.add('show');
  rs.innerHTML=hits.length?'':'<button disabled>没有匹配页面</button>';
  hits.slice(0,40).forEach(n=>{
    const b=document.createElement('button');
    b.innerHTML=`${esc(n.title)}<i style="color:${n.c.color}">${n.c.zh} · ${n.path}</i>`;
    b.onclick=()=>{animateCamTo({x:n.x,y:n.y,s:cam.s*2.5>fitScale()*40?cam.s:Math.max(cam.s,fitScale()*8)},700)};
    rs.appendChild(b);
  });
});
document.addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement!==si){e.preventDefault();si.focus()}});
function esc(s){return s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
// stats
document.getElementById('stats').innerHTML=
`<div><b>${DATA.total_pages}</b><span>PAGES 页面</span></div>
 <div><b>${clusters.length}</b><span>CLUSTERS 星系</span></div>
 <div><b>${(DATA.total_bytes/1048576).toFixed(1)}MB</b><span>LIBRARY 体量</span></div>`;
</script>
