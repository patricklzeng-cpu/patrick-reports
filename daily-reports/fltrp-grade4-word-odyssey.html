<script>
(()=>{'use strict';
const UNITS=JSON.parse(document.getElementById('vocab').textContent),ALL=UNITS.flatMap(u=>u.words.map((d,i)=>({...d,id:`u${u.id}-${i}`,unit:u.id,index:i}))),BYID=Object.fromEntries(ALL.map(d=>[d.id,d])),KEY='fltrp-word-odyssey-v1';
const $=s=>document.querySelector(s),app=$('#app'),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){$('#storage').hidden=false}
let records={};if(saved.records&&typeof saved.records==='object')for(const id of Object.keys(saved.records)){const r=saved.records[id];if(BYID[id]&&r&&typeof r==='object')records[id]={seen:!!r.seen,mastered:!!r.mastered,wrong:!!r.wrong,due:Number.isFinite(r.due)?r.due:0,success:Math.max(0,Math.min(10,Number(r.success)||0))}}
let xp=Number.isFinite(saved.xp)&&saved.xp>=0?saved.xp:0,sound=saved.sound!==false,unitId=Number(saved.unit)||1;if(!UNITS.some(u=>u.id===unitId))unitId=1;
let view='home',batch=0,mode='adventure',game=null,filterUnit='all',search='',contextSound,toastTimer;
const unit=()=>UNITS.find(u=>u.id===unitId),unitWords=id=>ALL.filter(d=>d.unit===id),rec=id=>records[id]||(records[id]={seen:false,mastered:false,wrong:false,due:0,success:0}),mastered=id=>unitWords(id).filter(d=>rec(d.id).mastered).length,wrongWords=()=>ALL.filter(d=>rec(d.id).wrong),dueWords=()=>ALL.filter(d=>rec(d.id).mastered&&rec(d.id).due<=Date.now());
function save(){try{localStorage.setItem(KEY,JSON.stringify({records,xp,unit:unitId,sound}))}catch(e){$('#storage').hidden=false}$('#xp').textContent=`✦ ${xp} 星尘`;$('#soundBtn').textContent=sound?'音效开':'音效关';$('#soundBtn').setAttribute('aria-pressed',sound)}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function go(v){if('speechSynthesis'in window)speechSynthesis.cancel();view=v;game=null;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('on',b.dataset.view===v));render();window.scrollTo({top:0,behavior:'instant'})}
function render(){save();if(view==='home')home();else if(view==='unit')unitView();else if(view==='library'||view==='repair')library();else if(view==='source')source();else if(view==='play')play();else if(view==='results')result()}
function astronaut(){return `<div class="spaceart" role="img" aria-label="小宇航员坐在紫色星球上"><div class="orbit"></div><div class="orbit second"></div><div class="globe"><i class="crater"></i><i class="crater two"></i><i class="crater three"></i></div><div class="astronaut"><div class="helmet"><div class="visor"><i class="shine"></i></div></div><div class="suit"></div></div><span class="flag">下一站，记忆宇宙！</span><span class="spark a">✧</span><span class="spark b">✦</span><span class="spark c">✧</span><span class="capsule">MISSION 01—06</span></div>`}

function start(words,m){if(!words.length)return;game={items:words.map(d=>d.id),queue:words.map(d=>d.id),mode:m,phase:m==='adventure'?'learn':'write',pos:0,miss:new Set(),initial:0,earned:0,choices:[],picked:[],letters:[],hint:false,error:false,answered:false,covered:false};if(m!=='adventure')game.queue=shuffle(game.queue);view='play';document.querySelectorAll('[data-view]').forEach(b=>b.classList.remove('on'));prepare();window.scrollTo({top:0,behavior:'instant'})}

function phaseText(p){return({learn:'记忆卡',match:'认词雷达',build:'拼字引擎',write:'默写发射'})[p]}
function play(){save();const g=game,d=current(),count=g.queue.length,progress=g.pos/count*100,phases=g.mode==='adventure'?['learn','match','build','write']:['write'];app.innerHTML=`<div class="gamearea"><div class="gameheader"><button id="exit">← 结束本轮</button><span class="gametitle">${g.mode==='review'?'记忆修复任务':`UNIT ${d.unit} · ${esc(UNITS[d.unit-1].title)}`}</span><span style="font-size:12px;color:var(--gold)">✦ +${g.earned}</span></div><div class="stagebar">${phases.map((p,i)=>`<span class="stage ${g.phase===p?'active':''}">${phases.length>1?i+1+' ':''}${phaseText(p)}</span>`).join('')}</div><section class="playpanel"><div class="playtop"><span>${g.mode==='listening'?'🎧 听音挑战':g.mode==='review'?'🛠️ 修复完成后，再隔日回访':'✦ 找回能量词'}</span><span>${g.pos+1} / ${count}</span></div><div class="track" role="progressbar" aria-label="当前阶段进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(progress)}"><i style="width:${progress}%"></i></div><div class="field" id="field"></div><div class="gamefoot"><span>不着急，试过就有进步 ♡</span><button id="gameSound">${sound?'♫ 音效开':'♫ 音效关'}</button></div></section><div class="flight"><span>🪐</span><div class="flightline"><span class="shipicon" style="left:${Math.min(95,progress)}%">🚀</span></div><span>下一站：${g.phase==='learn'?'认词雷达':g.phase==='match'?'拼字引擎':g.phase==='build'?'默写发射':'任务报告'}</span></div></div>`;
let html='';
if(g.phase==='learn')html=`<div class="tasklabel">看一眼，读一遍，再盖住回想</div><div class="emoji">${d.emoji}</div><div class="bigword" id="showword">${esc(d.answer)}</div><div class="meaning">${esc(d.zh)}</div><button class="speak" id="speak">🔊 听单词</button><div id="learnclues"><p class="example">${esc(d.ex)}<br>${esc(d.cn)}</p><div class="tip">💡 ${esc(d.tip)}${d.w!==d.answer?`<br>词表原条目：${esc(d.w)}。sb/sth 是“某人/某事”的占位符，只练 because of。`:''}</div></div><div class="actions"><button class="secondary" id="cover">盖住，自己想一想</button><button class="primary" id="next">${g.pos===count-1?'开启认词雷达 →':'记住了，下一个 →'}</button></div>`;
else if(g.phase==='match')html=`<div class="tasklabel">哪个意思和这个能量词相配？</div><div class="bigword" style="margin-top:30px">${esc(d.answer)}</div><button class="speak" id="speak">🔊 听单词</button><div class="choicegrid">${g.choices.map((c,i)=>`<button class="choice" data-choice="${i}">${esc(c.zh)}</button>`).join('')}</div><div class="actions"><button class="primary" id="next" hidden>继续探测 →</button></div>`;

$('#field').innerHTML=html+'<div id="feedback" class="feedback" aria-live="polite"></div>';
if($('#speak'))$('#speak').onclick=()=>speak(d.answer);if($('#next'))$('#next').onclick=next;if($('#hint'))$('#hint').onclick=hint;if($('#check'))$('#check').onclick=g.phase==='build'?check:null;if($('#answerform'))$('#answerform').onsubmit=e=>{e.preventDefault();g.answered?next():check()};if($('#cover'))$('#cover').onclick=()=>{g.covered=!g.covered;$('#showword').textContent=g.covered?'✦ ✦ ✦':d.answer;$('#learnclues').hidden=g.covered;$('#cover').textContent=g.covered?'揭开，看看记对没':'盖住，自己想一想';feedback(g.covered?'在纸上写一遍，或闭上眼睛拼一遍。':'对照一下，再把它请进脑袋里。')};if($('#toChinese'))$('#toChinese').onclick=()=>{g.mode='dictation';play()};if(g.phase==='build')drawLetters();document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>choose(+b.dataset.choice,b));$('#gameSound').onclick=()=>{sound=!sound;save();$('#gameSound').textContent=sound?'♫ 音效开':'♫ 音效关'};$('#exit').onclick=()=>dialog('回到星球地图？','已获得的星尘和学习记录会保留。本轮未完成的题，下次需要重新开始。',()=>go('home'),'回到地图');}
function feedback(s,error=false){const f=$('#feedback');if(f){f.textContent=s;f.classList.toggle('error',error)}}
function drawLetters(){const g=game,d=current();let i=0;$('#slots').innerHTML=[...d.answer.toLowerCase()].map(c=>{if(!/[a-z]/.test(c))return `<span class="slot fixed" aria-hidden="true">${c===' '?'·':esc(c)}</span>`;const pos=i++,index=g.picked[pos];return index===undefined?'<span class="slot">_</span>':`<button class="slot" data-remove="${pos}" ${g.answered?'disabled':''} aria-label="撤回字母 ${g.letters[index]}">${g.letters[index]}</button>`}).join('');$('#letters').innerHTML=g.letters.map((c,i)=>`<button class="letter" data-letter="${i}" ${g.picked.includes(i)||g.answered?'disabled':''}>${c}</button>`).join('');document.querySelectorAll('[data-letter]').forEach(b=>b.onclick=()=>{g.picked.push(+b.dataset.letter);drawLetters()});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{g.picked.splice(+b.dataset.remove,1);drawLetters()})}
function choose(i,b){const g=game,d=current();if(g.answered)return;if(g.choices[i].id!==d.id){g.error=true;b.classList.add('wrong');b.disabled=true;feedback('这个雷达信号还没配上，再看看其他意思。',true);return}b.classList.add('correct');g.answered=true;gain(1);document.querySelectorAll('[data-choice]').forEach(x=>x.disabled=true);$('#next').hidden=false;feedback('信号匹配成功！+1 星尘。');$('#next').focus()}
function norm(s){return s.toLowerCase().trim().replace(/[‐‑‒–—]/g,'-').replace(/[.!！。]+$/g,'').replace(/\s+/g,' ')}
function hint(){const g=game,d=current();if(g.answered)return;g.hint=true;if(g.phase==='write'){g.miss.add(d.id);rec(d.id).wrong=true}save();feedback(`答案是 ${d.answer}。${d.tip} 先学会，再试着写；本题会安排一次独立复习。`,true)}
function check(){const g=game,d=current();if(g.answered)return;let answer;if(g.phase==='build'){let i=0;answer=[...d.answer.toLowerCase()].map(c=>/[a-z]/.test(c)?(g.picked[i]!==undefined?g.letters[g.picked[i++]]:(i++,'_')):c).join('')}else answer=$('#answer').value;
if(!answer.trim()||(g.phase==='build'&&!g.picked.length)){feedback('先试一试；想不起来，可以点提示。',true);return}
if(norm(answer)!==norm(d.answer)){g.error=true;if(g.phase==='write'){g.miss.add(d.id);rec(d.id).wrong=true}let a=norm(answer),target=norm(d.answer),n=0;while(n<a.length&&a[n]===target[n])n++;save();feedback(`差一点点！${n?`开头 ${n} 个字符已经对了。`:'开头再想一想。'}${target.includes(' ')?'注意短语里的空格。':''}可以改一改，或点提示。`,true);return}
g.answered=true;rec(d.id).seen=true;const independent=!g.hint&&!g.error;if(g.phase==='write'){if(independent){g.initial++;let r=rec(d.id);r.mastered=true;r.wrong=false;r.success=Math.min(10,r.success+1);r.due=Date.now()+[1,3,7,14,30][Math.min(4,r.success-1)]*86400000}else{g.miss.add(d.id);rec(d.id).wrong=true}}const points=g.phase==='build'?1:independent?3:1;gain(points);feedback(g.phase==='build'?`引擎修好啦！+${points} 星尘。正确拼写：${d.answer}`:independent?`独立写对！+3 星尘。正确拼写：${d.answer}${mastered(d.unit)===UNITS[d.unit-1].words.length?' · 本单元徽章已点亮！🏅':''}`:`这次写对啦！+1 星尘。${d.answer} 会再来一次，让你独立试试。`);$('#check').hidden=true;$('#next').hidden=false;$('#hint').disabled=true;if($('#answer'))$('#answer').disabled=true;if(g.phase==='build')drawLetters();$('#next').focus()}

function next(){const g=game;if(g.phase!=='learn'&&!g.answered)return;if(g.phase==='learn'){rec(current().id).seen=true;save()}if(g.pos<g.queue.length-1){g.pos++;prepare();return}if(g.mode==='adventure'&&g.phase!=='write'){g.phase=({learn:'match',match:'build',build:'write'})[g.phase];g.queue=shuffle(g.items);g.pos=0;prepare();return}view='results';result()}
function result(){save();const g=game,miss=[...g.miss],perfect=miss.length===0,u=unit();app.innerHTML=`<div class="results"><section class="cardlight" style="position:relative;overflow:hidden"><div class="eyebrow" style="color:#897099">MISSION REPORT / 探险报告</div><div class="trophy">${perfect?'🏅':'🌱'}</div><h1>${perfect?'能量已送达，任务成功！':'又前进了一大步。'}</h1><p class="subtle">${perfect?'这一组已全部独立写对。明天回来，看看记忆有没有变得更结实。':'用过提示或写错的词，已经进入修复站。再独立试一次，就能修好它们。'}</p><div class="resultstats"><div><strong>${g.initial}<span style="font-size:16px">/${g.items.length}</span></strong><small>本轮首次无提示写对</small></div><div><strong>+${g.earned}</strong><small>本轮获得星尘</small></div></div>${miss.length?`<div class="misschips">${miss.map(id=>`<span>${esc(BYID[id].w)}</span>`).join('')}</div>`:''}<div class="actions">${miss.length?'<button class="primary" id="retry">去修复这几个词 →</button>':'<button class="primary" id="continue">继续探索下一关 →</button>'}<button class="secondary" id="map">返回星球地图</button></div><p class="subtle" style="margin-top:23px;font-size:12px">星尘奖励努力，徽章记录独立默写。每颗星星，都由你点亮。</p></section></div>`;$('#map').onclick=()=>go('home');if($('#retry'))$('#retry').onclick=()=>start(miss.map(id=>BYID[id]),'review');if($('#continue'))$('#continue').onclick=()=>{const ws=unitWords(unitId),idx=Array.from({length:Math.ceil(ws.length/5)},(_,i)=>i).find(i=>ws.slice(i*5,i*5+5).some(d=>!rec(d.id).mastered));if(idx!==undefined)batch=idx;else{const next=UNITS.find(x=>mastered(x.id)<x.words.length);if(next){unitId=next.id;batch=0}}go('unit')};if(perfect)confetti();window.scrollTo({top:0,behavior:'instant'})}
function library(){const repair=view==='repair';app.innerHTML=`<div class="bookhead"><div><h1>${repair?'错词修复站':'词语图鉴'}</h1><div class="lead">${repair?'曾经写错、用过提示的词，在这里重新点亮。':'按教材 Unit 收齐 161 个单词与表达。释义与例句为练习整理。'}</div></div>${repair?'<button class="primary" id="repairStart">开始修复 →</button>':'<button class="secondary darksecondary" id="print">打印默写纸</button>'}</div><div class="filters"><input id="search" aria-label="搜索词语或中文意思" placeholder="搜索单词或中文…" value="${esc(search)}"><select id="filter" aria-label="按单元筛选"><option value="all">全部单元</option>${UNITS.map(u=>`<option value="${u.id}" ${String(u.id)===filterUnit?'selected':''}>Unit ${u.id} · ${u.cn}</option>`).join('')}</select></div><div id="listCount" class="subtle" style="color:var(--muted);margin-bottom:15px"></div><div class="wordlist" id="wordlist"></div>`;$('#search').oninput=e=>{search=e.target.value;drawLibrary()};$('#filter').onchange=e=>{filterUnit=e.target.value;drawLibrary()};if($('#repairStart'))$('#repairStart').onclick=()=>{const ws=filtered().slice(0,10);if(ws.length)start(ws,'review');else toast('这里暂时没有待修复的词。你可以回星球地图继续探险。')};if($('#print'))$('#print').onclick=printWords;drawLibrary()}
function filtered(){return ALL.filter(d=>(view!=='repair'||rec(d.id).wrong)&&(filterUnit==='all'||String(d.unit)===filterUnit)&&(!search||`${d.w} ${d.zh}`.toLowerCase().includes(search.toLowerCase().trim())))}
function drawLibrary(){const ws=filtered();$('#listCount').textContent=`当前 ${ws.length} 个词条${view==='repair'?' · 每次修复最多 10 个，剩余的下轮继续':''}`;$('#wordlist').innerHTML=ws.length?ws.map(d=>`<article class="worditem"><div class="wordrow"><strong>${esc(d.w)}</strong><button data-say="${d.id}" aria-label="朗读 ${esc(d.answer)}">🔊</button></div><p>${d.emoji} ${esc(d.zh)}</p><small>Unit ${d.unit} · ${rec(d.id).wrong?'🛠 待修复':rec(d.id).mastered?'✦ 已独立写对':rec(d.id).seen?'◐ 已见过':'○ 尚未练习'}</small><small>${esc(d.ex)}<br>${esc(d.cn)}</small></article>`).join(''):'<div class="empty">✧<br><br>没有符合条件的词。<br>可以清空搜索或切换单元。</div>';document.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>speak(BYID[b.dataset.say].answer))}
function printWords(){const ws=filtered();if(!ws.length){toast('先选择至少一个词条再打印。');return}$('#printsheet').innerHTML=`<h1>星际单词局 · 默写任务纸</h1><p>外研版四年级上册 · ${filterUnit==='all'?'全部单元':'Unit '+filterUnit} · ${ws.length} 词条　　姓名：____________　日期：____________</p><p>根据中文写英文。标有“短语”的题目，请写完整短语。做完可回游戏图鉴核对。</p><table><thead><tr><th>编号 / 单元</th><th>中文提示</th><th class="blank">英文默写</th></tr></thead><tbody>${ws.map((d,i)=>`<tr><td>${i+1} / U${d.unit}</td><td>${esc(d.zh)}${d.answer.includes(' ')?'（短语）':''}</td><td><div class="line"></div></td></tr>`).join('')}</tbody></table>`;window.print()}
function source(){app.innerHTML=`<article class="source"><div class="eyebrow">FOR GROWN-UPS / 教材与家长说明</div><h1>先对教材，再轻松练习。</h1><p>本游戏对应外研社《英语》新标准三年级起点四年级上册、孙有中主编的新教材体系。识别依据是 Unit 1 “I love sports” 到 Unit 6 “Find your way”；与你此前提供的 sport、jump、because、money 等词对应。采用网上公开的 2025 新版电子课本及按单元默写表核对；未将旧版 10 个 Module 词表混入，也未声称核验了 2026 印次的版权页。</p><h2>词库范围与核对</h2><p>词库按书后 “Words and expressions” 编排，161 条包含单词及短语；这里的条数不等于 161 个单独单词。英文条目和 Unit 归属据来源核对，中文释义为适合游戏提示的整理版，例句为新编，不是课文原句。不复刻教材页面。</p><table><thead><tr><th>Unit</th><th>教材标题</th><th>词条数</th></tr></thead><tbody>${UNITS.map(u=>`<tr><td>${u.id}</td><td>${esc(u.title)}</td><td>${u.words.length}</td></tr>`).join('')}<tr><td colspan="2">合计</td><td>161</td></tr></tbody></table><div class="notebox"><strong>来源</strong><p><a href="https://fliphtml5.com/qyohl/uurz/" target="_blank" rel="noopener">新版电子课本公开镜像 · 目录及书后 Words and expressions</a>：词表印刷页 82–85（阅读器第 86–89 页），用于核对范围和跨页归属。</p><p><a href="https://www.10100.com/article/38628975" target="_blank" rel="noopener">2025 新版四年级上册分单元默写表</a>：交叉核对条目和分组。此页重复列了一次 Unit 4，本游戏只收录一次。</p><p><a href="https://zy.21cnjy.com/23483945" target="_blank" rel="noopener">Unit 1 单元知识资料</a>：辅助核对版本与词义。</p><p><a href="https://zy.21cnjy.com/23390582" target="_blank" rel="noopener">全册单元知识资料</a>：辅助核对教材语境，例如 Unit 3 的 by 使用“经过”义。核对日期：2026-09-07。</p></div><h2>几个容易混淆的地方</h2><ul><li>because of sb/sth 保留原条目；sb/sth 是“某人/某事”的语法占位符，拼字与默写练习填写 because of。</li><li>有连字符和空格的表达也纳入练习，如 ping-pong、to-do list。拼字关自动提供分隔符，默写关需要自己写。</li><li>采用教材的英式拼写 favourite、centre。大小写、首尾多余空格和句末感叹号不影响得分；拼写与词间空格仍须正确。</li><li>star 出现在你上一次的自选词组中，但未列入本次核对的书后词表，所以没有擅自加入教材词库。</li><li>不含另外列出的 Proper nouns 或 Words and expressions in plays，也没有把教材星号要求推定成“全部必须会默写”。可按老师要求选关。</li></ul><h2>怎样陪孩子玩</h2><p>先选一组最多 5 个词，让孩子看、读、盖住回想；再认意思、拼字、看中文独立默写。答错不扣分，用提示后会进入修复站。只有当前默写题首次无提示答对，才记为“独立写对”；星球里所有词都做到一次，就点亮徽章。徽章记录练习成绩，不代表永久记住。</p><p>独立写对后，回访间隔依次为 1、3、7、14、30 天。没有后台提醒；打开游戏时可进入“隔日记忆回访”。星尘可通过重复练习获得，徽章以词条的独立默写记录为准。</p><p>英文朗读调用浏览器和设备提供的英语语音，音色与可用性因设备而异。网页本身不请求录音权限。音效开关控制答对音效；朗读由“听单词”按钮主动触发。学习记录保存在当前浏览器的本地存储，不需要注册，不会跨设备同步。切换浏览器、清理数据或部分无痕模式可能导致记录丢失。</p><div class="actions"><button class="primary" id="sourceBack">回到星球地图</button><button class="secondary darksecondary" id="reset">清空本游戏记录</button></div></article>`;$('#sourceBack').onclick=()=>go('home');$('#reset').onclick=()=>dialog('重新开始全部探险？','这将清空这款新版游戏的星尘、徽章、错词和回访记录。',()=>{records={};xp=0;unitId=1;save();go('home')},'清空记录')}
function speak(word){if(!('speechSynthesis'in window)){toast('此浏览器不支持朗读。可以使用“看中文默写”继续练习。');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(word);u.lang='en-GB';u.rate=.8;let voices=speechSynthesis.getVoices();u.voice=voices.find(v=>v.lang==='en-GB')||voices.find(v=>v.lang.startsWith('en'))||null;u.onerror=()=>toast('朗读未能播放。请检查设备音量，或改用看中文默写。');speechSynthesis.speak(u)}
function chime(){if(!sound)return;try{contextSound=contextSound||new(window.AudioContext||window.webkitAudioContext)();contextSound.resume();[523,659,784].forEach((f,i)=>{let o=contextSound.createOscillator(),v=contextSound.createGain();o.connect(v);v.connect(contextSound.destination);o.frequency.value=f;v.gain.setValueAtTime(.03,contextSound.currentTime+i*.09);v.gain.exponentialRampToValueAtTime(.001,contextSound.currentTime+i*.09+.18);o.start(contextSound.currentTime+i*.09);o.stop(contextSound.currentTime+i*.09+.19)})}catch(e){}}
function toast(msg){let t=$('#toast');if(t)t.remove();t=document.createElement('div');t.id='toast';t.className='toast';t.setAttribute('role','status');t.textContent=msg;app.append(t);clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.remove(),9000)}
function dialog(title,msg,action,label){const box=$('#modal'),previous=document.activeElement;box.hidden=false;box.className='modalback';box.innerHTML=`<section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogtitle"><h2 id="dialogtitle">${esc(title)}</h2><p>${esc(msg)}</p><div class="actions"><button class="secondary" id="cancel">继续练习</button><button class="primary" id="confirm">${esc(label)}</button></div></section>`;const close=()=>{box.hidden=true;box.innerHTML='';if(previous?.isConnected)previous.focus()};$('#cancel').onclick=close;$('#confirm').onclick=()=>{close();action()};box.onkeydown=e=>{if(e.key==='Escape'){close();return}if(e.key==='Tab'){const bs=[...box.querySelectorAll('button')];if(e.shiftKey&&document.activeElement===bs[0]){e.preventDefault();bs[1].focus()}else if(!e.shiftKey&&document.activeElement===bs[1]){e.preventDefault();bs[0].focus()}}};$('#cancel').focus()}
function confetti(){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;let c=document.createElement('div');c.className='confetti';c.innerHTML=Array.from({length:32},(_,i)=>`<i style="left:${Math.random()*100}%;background:${['#ac90cf','#88c4a0','#e8bd67'][i%3]};animation-delay:${Math.random()*.3}s"></i>`).join('');$('.results .cardlight').append(c);setTimeout(()=>c.remove(),2300)}
function navigate(v){if(view==='play')dialog('离开当前练习？','已完成的学习记录会保留。本轮还没完成的题，下次重新开始。',()=>go(v),'离开练习');else go(v)}
$('#brand').onclick=()=>navigate('home');document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{filterUnit='all';search='';navigate(b.dataset.view)});$('#sourceBtn').onclick=()=>navigate('source');$('#soundBtn').onclick=()=>{sound=!sound;save()};go('home');
})();
</script></body></html>
