name: Rocket Launch DB — reconcile reality

on:
  schedule:
    # Hourly at :17 UTC. The browser also reclassifies elapsed windows immediately.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rocket-launch-db-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test lifecycle rules
        working-directory: public-deploy/rocket-launch-db
        run: npm test

      - name: Fetch LL2 and reconcile upcoming/history
        working-directory: public-deploy/rocket-launch-db
        env:
          LL2_UPCOMING_PAGES: "2"
          LL2_PREVIOUS_PAGES: "1"
        run: npm run build:data

      - name: Validate generated data
        working-directory: public-deploy/rocket-launch-db
        run: node scripts/validate-data.mjs

      - name: Commit and push refreshed data
        run: |
          git config user.email "actions@github.com"
          git config user.name "rocket-launch-db-bot"
          git add public-deploy/rocket-launch-db/data/launches.json
          git add public-deploy/rocket-launch-db/data/upcoming.json
          git add public-deploy/rocket-launch-db/data/stats.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "chore(rockets): reconcile launch state $(date -u '+%Y-%m-%dT%H:%MZ')"
            git push origin HEAD:main
          fi

